# Build the switcher APK and run the drift tests.
#
# The APK is the one artifact of this repo that cannot be produced by reading the
# source: it needs JDK 17 + the Android SDK, which is why app/build_apk.sh exists to
# provision both under WSL. This workflow does the same on a runner, so a working APK
# can be downloaded straight onto a phone or the device itself, with no PC involved.
#
# The tests are the dependency-free suites under partB-installer/tests. They are cheap
# and they guard cross-file drift (the boot gate is written in five places, in five
# languages), so they run on every push and PR with no path filter -- a filter that
# missed one of those five files would let exactly the drift they exist to catch slip
# through unguarded.

name: Build

on:
  # Callable so the release workflow reuses these exact jobs rather than copying them. The
  # APK's cached debug keystore in particular MUST NOT be duplicated: a second copy that
  # drifted would sign releases with a different key, and every user would have to uninstall
  # the app before they could update it.
  workflow_call:
  push:
    branches: [main]
  pull_request:
  # Lets you build an APK from any branch by hand: Actions -> Build -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: drift tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Each suite is a plain script with its own runner and exit code (no pytest, by
      # design -- they must run on a bare machine). Run them all before failing, so one
      # broken suite does not hide the state of the others.
      - name: run the test suites
        working-directory: partB-installer
        run: |
          set -u
          fail=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python3 "$t" || fail=1
            echo "::endgroup::"
          done
          # The Python suites read the update hook as text. test_update_hook.sh EXECUTES its
          # write helpers, which is the only way to know they actually run in a POSIX shell.
          for t in tests/test_*.sh; do
            echo "::group::$t"
            sh "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  apk:
    name: build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # app/build.gradle pins source/target to 17

      - uses: android-actions/setup-android@v3

      - name: install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # A debug APK is signed with ~/.android/debug.keystore. On a fresh runner that key
      # is NEW every run, so each CI build would refuse to install over the previous one
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE) and you would have to uninstall the app
      # before every update. Caching it under a constant key keeps one stable debug
      # identity across builds. A debug keystore holds no secret -- its password is the
      # fixed, public "android" -- and it can only sign debug builds. If the cache is
      # ever evicted the key changes, and you uninstall once.
      - name: restore the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      # Create it ourselves on a cache miss, with the standard debug credentials, rather
      # than letting the build generate one. AGP creates the keystore during signing,
      # which is AFTER the cache step has validated its path -- so the post-run save
      # found nothing ("Path Validation Error ... no cache is being saved") and the key
      # was never actually stable. Making the file exist up front fixes that, and AGP
      # reuses an existing keystore instead of generating one.
      - name: create the debug signing key if not cached
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -f ~/.android/debug.keystore ]; then
            echo "restored from cache"
          else
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "generated a new debug key"
          fi

      - name: assembleDebug
        working-directory: partB-installer/app/RebootToCoreELEC
        run: |
          # gradlew is tracked mode 100644, so restore the exec bit -- build_apk.sh does
          # the same. (.gitattributes already forces its line endings to LF.)
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      # Rename to the filename install.py looks for, so the download can be dropped
      # straight into partB-installer/artifacts/ and used as-is.
      - name: stage the APK
        working-directory: partB-installer/app/RebootToCoreELEC
        run: |
          set -euo pipefail
          src=$(find app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$src" ] || { echo "no APK was produced"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          cp "$src" "$RUNNER_TEMP/out/RebootToCoreELEC.apk"
          echo "built:  $src"
          sha256sum "$RUNNER_TEMP/out/RebootToCoreELEC.apk"
          # The signer identity decides whether this APK installs OVER the one already on
          # the device or demands an uninstall first. Print it: if this fingerprint is the
          # same as the previous build's, `adb install -r` will just work.
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            "$RUNNER_TEMP/out/RebootToCoreELEC.apk" | grep -i "SHA-256\|Signer #1 certificate DN"

      # Prove the APK is one Android will actually accept, so "There was a problem
      # parsing the package" on a device can never be blamed on the build. aapt2 reads
      # the package the same way the platform's installer does: if the archive were
      # truncated, unsigned, or not an APK at all, badging fails here instead of on the
      # device. Prints the package id + versions, which is also how you tell the debug
      # build (com.jamal2367.coreelec.debug) from a release one at a glance.
      - name: verify the APK parses
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/out/RebootToCoreELEC.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$apk" \
            | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^application-label:"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"

          # The APK is a RELEASE ASSET, so the version it reports must be the version the
          # source declares -- otherwise a bumped build.gradle can ship under the old number
          # (or a stale APK can ride along under a new one) and nobody can tell which build
          # a device is running.
          gradle="partB-installer/app/RebootToCoreELEC/app/build.gradle"
          wantCode=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]\+\([0-9]\+\).*/\1/p' "$gradle")
          wantName=$(sed -n "s/^[[:space:]]*versionName[[:space:]]\+'\([^']*\)'.*/\1/p" "$gradle")
          badging=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$apk" | head -n1)
          gotCode=$(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          gotName=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "build.gradle: versionCode=$wantCode versionName=$wantName"
          echo "built APK   : versionCode=$gotCode versionName=$gotName"
          [ -n "$wantCode" ] && [ -n "$wantName" ] || { echo "could not read the version out of $gradle"; exit 1; }
          [ "$gotCode" = "$wantCode" ] && [ "$gotName" = "$wantName" ] || {
            echo "APK version does not match build.gradle -- refusing to ship it"; exit 1; }
          echo "APK parses, is signed, is installable, and matches build.gradle."

      - uses: actions/upload-artifact@v4
        with:
          name: RebootToCoreELEC-apk-${{ github.sha }}
          path: ${{ runner.temp }}/out/RebootToCoreELEC.apk
          if-no-files-found: error
